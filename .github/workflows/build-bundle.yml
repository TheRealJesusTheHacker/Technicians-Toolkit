name: Build bundle

# The bundle pipeline: test the launcher, build it on Windows,
# assemble the bundle from the tools' own releases (hash-verified),
# prove the built zip, run the shipped launcher's own --check against
# the shipped bundle, and — on a version dispatch — publish the release.
#
# A dispatch with the version left empty does everything except
# publish, and uploads the bundle as a workflow artifact instead:
# the proof run before any release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to create (e.g. v1.3.2). Leave empty for a dry run: builds only, nothing uploaded."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - name: Check out the bundle repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the launcher build environment
        run: pip install --require-hashes -r launcher/requirements-ci.lock.txt

      - name: Launcher tests (offscreen)
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: python -m pytest launcher/tests -q

      - name: Assembler tests
        run: python -m pytest bundle/tests -q

      - name: Build the launcher (one file)
        working-directory: launcher
        run: >
          pyinstaller --noconfirm
          --distpath ../dist/launcher
          --workpath ../build/launcher
          TechniciansToolkit.spec

      - name: Assemble the bundle
        run: >
          python bundle/assemble_bundle.py assemble
          --download-dir downloads
          --work-dir assembly
          --out-dir dist
          --launcher-file dist/launcher/TechniciansToolkit.exe

      - name: Verify the assembled bundle
        run: >
          python bundle/assemble_bundle.py verify
          --zip dist/TechniciansToolkit-v1.3.1.zip
          --work-dir assembly

      - name: Shipped launcher against the shipped bundle
        shell: pwsh
        run: |
          Expand-Archive dist/TechniciansToolkit-v1.3.1.zip -DestinationPath smoke -Force
          $proc = Start-Process -FilePath "smoke/TechniciansToolkit/TechniciansToolkit.exe" -ArgumentList "--check" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "The shipped launcher's --check failed with exit code $($proc.ExitCode)" }
          Write-Host "Shipped launcher --check passed against the shipped bundle."

      - name: Upload the bundle (proof runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TechniciansToolkit-bundle
          path: |
            dist/TechniciansToolkit-v1.3.1.zip
            dist/SHA256SUMS.txt

      - name: Publish the bundle release
        if: inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          **The Technician's Toolkit — the complete kit, all eight members current.** One zip that opens to one folder: all eight medic-kit tools in portable form, plus the suite launcher in the same folder. This is bundle 1.3.1 — the bundle rebuilt with VectorZip at its Fleet Sweep #6 release: VectorZip moves to v1.2.12 (a publish-pipeline security fix), the other seven members are exactly as in bundle 1.3.0, and Sphinx remains at 1.0.1 pending the owner's on-device acceptance.

          ## In this bundle

          | Tool | Version | Form |
          |---|---|---|
          | Argus | 1.2.13 | Portable — `Argus.exe` (+ its portable-mode starter) |
          | NitroCore | 1.1.7 | Portable — `NitroCoreOptimizer.exe` + its `_internal/` |
          | VectorZip | 1.2.12 | Portable — `VectorZip.exe` |
          | Charon | 1.0.6 | Portable — in its own `Charon/` folder, as it ships |
          | Lazarus | 1.0.5 | Portable — `Lazarus.exe` |
          | Aegis | 1.0.6 | Portable — in its own `Aegis/` folder, as it ships |
          | Beerus | 0.6.4 | Portable app — in a `Beerus/` folder (see the second note below) |
          | Sphinx | 1.0.1 | Portable — in its own `SphinxPortable/` folder, as it ships |
          | **Suite launcher** | **1.0.7** | `TechniciansToolkit.exe` — one window over the whole kit |
          | Beerus — Live Boot | — | Never a folder: the bootable stick is its own USB stick |

          New in this bundle — VectorZip moves from 1.2.11 to 1.2.12: a publish-pipeline security fix (pip 25.3 → 26.2 in VectorZip's publish install set only, clearing five pip GHSAs including CVE-2026-13346); no shipped VectorZip code, format, or behaviour changed, so the VectorZip in this bundle works exactly as the one in bundle 1.3.0. Every other member is unchanged from bundle 1.3.0: Argus 1.2.13, NitroCore 1.1.7, Charon 1.0.6, Lazarus 1.0.5, Aegis 1.0.6, and Beerus 0.6.4. Sphinx remains at 1.0.1 — its next version is held pending the owner's on-device acceptance, and no newer Sphinx is in this bundle. The suite launcher stays at 1.0.7 — cards, stripes, states, and launching are as they were. The bundle is built with hash-locked installs, and every member artifact is verified against its maker's published checksums before assembly. No Argus witness run and no hardware or on-device proof is claimed for bundle 1.3.1.

          Beerus is in this bundle twice, once per form: the app above, and its other form — the bootable Live Boot — accounted for in the manifest as a link, never as files. Beerus Portable keeps its certificates of destruction in `Beerus/certificates` and its file, folder, and free-space wipe reports in `Beerus/certificates/reports` — your job records, inside the folder.

          Aegis keeps almost nothing anywhere else: no registry entries, no temporary copies — a small settings file holding the two timing choices (the quiet-time lock and how long a copied password stays), and — since v1.0.5 — a small vault-state file holding check values only: the newest state of each vault Aegis has seen on that computer, remembered outside the vault file as its rollback tripwire (no vault content, no file names). Its vaults are single sealed files (`.aegis`) that you name and place yourself. Lazarus keeps its backup stores in a folder you name, refuses system folders for them, and always writes rescued files to a different drive than the one being rescued.

          Every tool also runs standalone from the bundle folder — the launcher is a front door, not a lock. Every file inside was verified against its maker's published checksums before assembly; the bundle's own `MANIFEST.json` + `SHA256SUMS.txt` (inside the folder) and the `SHA256SUMS.txt` attached to this release (covering the zip) let you verify it again.

          Two collisions, resolved openly and recorded in the manifest:

          1. Six of the eight portable editions carry a `README-PORTABLE.txt` at their top level, each with different contents, so in the bundle they are `README-PORTABLE-<Tool>.txt` — contents unchanged. Aegis's readme sits inside its `Aegis/` folder exactly as its portable ships, so it never reaches the bundle's level and keeps its own name; Sphinx's portable carries no readme at all, so there is nothing of Sphinx's to qualify.
          2. Beerus Portable and NitroCore are both one-folder apps whose support folder is named `_internal`, and two different support folders cannot share one level — so Beerus sits in a `Beerus/` folder inside the bundle (the shape Charon ships in), its files byte for byte as released; only where they sit is different.

          *Built by Sentinel Safeguard LLC — Security For Everyone.*
          EOF
          if ! gh release view "${{ inputs.version }}" > /dev/null 2>&1; then
            gh release create "${{ inputs.version }}" \
              dist/TechniciansToolkit-v1.3.1.zip dist/SHA256SUMS.txt \
              --title "Technician's Toolkit ${{ inputs.version }}" \
              --notes-file release-notes.md
          else
            gh release upload "${{ inputs.version }}" \
              dist/TechniciansToolkit-v1.3.1.zip dist/SHA256SUMS.txt --clobber
          fi
