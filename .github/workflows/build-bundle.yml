name: Build bundle

# The bundle pipeline: test the launcher, build it on Windows,
# assemble the bundle from the tools' own releases (hash-verified),
# prove the built zip, run the shipped launcher's own --check against
# the shipped bundle, and — on a version tag — publish the release.
#
# A manual run (workflow_dispatch) does everything except publish,
# and uploads the bundle as a workflow artifact instead: the proof
# run before any tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - name: Check out the bundle repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the launcher build environment
        run: pip install -r launcher/requirements-ci.txt

      - name: Launcher tests (offscreen)
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: python -m pytest launcher/tests -q

      - name: Build the launcher (one file)
        working-directory: launcher
        run: >
          pyinstaller --noconfirm
          --distpath ../dist/launcher
          --workpath ../build/launcher
          TechniciansToolkit.spec

      - name: Assemble the bundle
        run: >
          python bundle/assemble_bundle.py assemble
          --download-dir downloads
          --work-dir assembly
          --out-dir dist
          --launcher-file dist/launcher/TechniciansToolkit.exe

      - name: Verify the assembled bundle
        run: >
          python bundle/assemble_bundle.py verify
          --zip dist/TechniciansToolkit-v1.0.0.zip
          --work-dir assembly

      - name: Shipped launcher against the shipped bundle
        shell: pwsh
        run: |
          Expand-Archive dist/TechniciansToolkit-v1.0.0.zip -DestinationPath smoke -Force
          $proc = Start-Process -FilePath "smoke/TechniciansToolkit/TechniciansToolkit.exe" -ArgumentList "--check" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "The shipped launcher's --check failed with exit code $($proc.ExitCode)" }
          Write-Host "Shipped launcher --check passed against the shipped bundle."

      - name: Upload the bundle (proof runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TechniciansToolkit-bundle
          path: |
            dist/TechniciansToolkit-v1.0.0.zip
            dist/SHA256SUMS.txt

      - name: Publish the bundle release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          **The Technician's Toolkit — the complete kit.** One zip that opens to one folder: all seven medic-kit tools in portable form, plus the suite launcher in the same folder. This is bundle 1.0, the first bundle that carries the whole line.

          ## In this bundle

          | Tool | Version | Form |
          |---|---|---|
          | Argus | 1.2.3 | Portable — `Argus.exe` (+ its portable-mode starter) |
          | NitroCore | 1.1.4 | Portable — `NitroCoreOptimizer.exe` + its `_internal/` |
          | VectorZip | 1.2.5 | Portable — `VectorZip.exe` |
          | Charon | 1.0.1 | Portable — in its own `Charon/` folder, as it ships |
          | Lazarus | 1.0.0 | Portable — `Lazarus.exe` |
          | Aegis | 1.0.1 | Portable — in its own `Aegis/` folder, as it ships |
          | Beerus | 0.4.0 | Portable app — in a `Beerus/` folder (see the second note below) |
          | **Suite launcher** | **1.0.0** | `TechniciansToolkit.exe` — one window over the whole kit |
          | Beerus — Destruct Key Pro | — | Never a folder: the bootable stick is its own USB stick |

          New in this bundle: **Lazarus** (restore by date, undelete, drive rescue) and **Aegis** (file vaults and a password manager) join as files. With them the kit is complete in the folder: the launcher shows seven Launch buttons, plus one honest card for the bootable stick.

          Beerus is in this bundle twice, once per form: the app above, and its other form — the bootable Destruct Key Pro — accounted for in the manifest as a link, never as files. Beerus Portable keeps its certificates of destruction in `Beerus/certificates` and its file, folder, and free-space wipe reports in `Beerus/certificates/reports` — your job records, inside the folder.

          Aegis keeps nothing anywhere else: no settings folder, no registry entries, no temporary copies — its vaults are single sealed files (`.aegis`) that you name and place yourself. Lazarus keeps its backup stores in a folder you name, refuses system folders for them, and always writes rescued files to a different drive than the one being rescued.

          Every tool also runs standalone from the bundle folder — the launcher is a front door, not a lock. Every file inside was verified against its maker's published checksums before assembly; the bundle's own `MANIFEST.json` + `SHA256SUMS.txt` (inside the folder) and the `SHA256SUMS.txt` attached to this release (covering the zip) let you verify it again.

          Two collisions, resolved openly and recorded in the manifest:

          1. Six of the seven portable editions carry a `README-PORTABLE.txt` at their top level, each with different contents, so in the bundle they are `README-PORTABLE-<Tool>.txt` — contents unchanged. Aegis's readme sits inside its `Aegis/` folder exactly as its portable ships, so it never reaches the bundle's level and keeps its own name.
          2. Beerus Portable and NitroCore are both one-folder apps whose support folder is named `_internal`, and two different support folders cannot share one level — so Beerus sits in a `Beerus/` folder inside the bundle (the shape Charon ships in), its files byte for byte as released; only where they sit is different.

          *Built by Sentinel Safeguard LLC — Security For Everyone.*
          EOF
          gh release create "${{ github.ref_name }}" \
            dist/TechniciansToolkit-v1.0.0.zip dist/SHA256SUMS.txt \
            --title "Technician's Toolkit ${{ github.ref_name }}" \
            --notes-file release-notes.md
