name: Witness probe (TEMP — bundle 1.0)

# Temporary evidence workflow for the bundle 1.0 publish: runs the
# Argus v1.2.6 engine over the assembled bundle on windows-latest
# (anchored / variant / controls / unanchored), and exercises the
# shipped frozen Argus.exe's self-checks in place. Removed once the
# evidence is collected — same discipline as the kit-hunt probe.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: toolkit
      - uses: actions/checkout@v4
        with:
          repository: TheRealJesusTheHacker/Argus.exe
          ref: v1.2.6
          path: argus-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install pyinstaller PySide6
      - name: Build the suite launcher
        working-directory: toolkit/launcher
        run: pyinstaller --noconfirm TechniciansToolkit.spec
      - name: Assemble the bundle from the pins
        run: python toolkit/bundle/assemble_bundle.py assemble --launcher-file toolkit/launcher/dist/TechniciansToolkit.exe --out-dir dist
      - name: Extract the bundle (plus a variant copy)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          Expand-Archive dist/TechniciansToolkit-v1.0.0.zip -DestinationPath work/extract -Force
          Copy-Item -Recurse work/extract/TechniciansToolkit work/bundle
          Copy-Item -Recurse work/bundle work/bundle-variant
      - name: Build control executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force controls-src, controls | Out-Null
          Set-Content controls-src/hello.py 'print("hello")'
          Set-Content controls-src/pyside_hello.py "from PySide6.QtWidgets import QApplication; import sys; app = QApplication(sys.argv); print('pyside hello')"
          pyinstaller --onefile --noconfirm --distpath controls --name hello controls-src/hello.py
          pyinstaller --onefile --noconfirm --distpath controls --name pyside-hello controls-src/pyside_hello.py
          Copy-Item C:\Windows\System32\cmd.exe controls\cmd.exe
          Copy-Item C:\Windows\System32\notepad.exe controls\notepad.exe
      - name: Stage unanchored copies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bare | Out-Null
          Copy-Item work/bundle/Argus.exe bare\Argus.exe
          Copy-Item work/bundle/TechniciansToolkit.exe bare\TechniciansToolkit.exe
          Copy-Item work/bundle/VectorZip.exe bare\VectorZip.exe
      - name: Witness — anchored full-bundle scan
        timeout-minutes: 90
        env:
          ARGUS_SRC: ${{ github.workspace }}/argus-src
          PROBE_WORK: ${{ github.workspace }}/probe-data
          ARGUS_DATA_DIR: ${{ github.workspace }}/work/bundle/ArgusData
        run: python toolkit/witness/probe.py anchored work/bundle results-anchored.json
      - name: Witness — variant (EICAR planted + tampered sibling)
        timeout-minutes: 90
        env:
          ARGUS_SRC: ${{ github.workspace }}/argus-src
          PROBE_WORK: ${{ github.workspace }}/probe-data
          ARGUS_DATA_DIR: ${{ github.workspace }}/work/bundle-variant/ArgusData
        run: python toolkit/witness/probe.py variant work/bundle-variant results-variant.json
      - name: Witness — controls (no anchor)
        timeout-minutes: 30
        env:
          ARGUS_SRC: ${{ github.workspace }}/argus-src
          PROBE_WORK: ${{ github.workspace }}/probe-data
        run: python toolkit/witness/probe.py controls controls results-controls.json
      - name: Witness — unanchored copies (no anchor)
        timeout-minutes: 30
        env:
          ARGUS_SRC: ${{ github.workspace }}/argus-src
          PROBE_WORK: ${{ github.workspace }}/probe-data
        run: python toolkit/witness/probe.py unanchored bare results-unanchored.json
      - name: Witness — frozen Argus self-checks + GUI observation
        continue-on-error: true
        timeout-minutes: 15
        env:
          ARGUS_SRC: ${{ github.workspace }}/argus-src
          PROBE_WORK: ${{ github.workspace }}/probe-data
        run: python toolkit/witness/probe.py frozen work/bundle results-frozen.json
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @('results-anchored.json','results-variant.json','results-controls.json','results-unanchored.json','results-frozen.json')) {
            if (Test-Path $f) { echo "===== $f"; Get-Content $f -Raw }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: witness-results
          path: results-*.json
          if-no-files-found: warn
